# Do not inherit lint policy from unrelated parent checkouts.
set noparent

# Google-internal header bans, not general best practice. cpplint 2.0.2 flags
# only <cfenv>, <fenv.h>, <ratio> (c++11) and <filesystem> (c++17); this C++20
# project uses them freely.
filter=-build/c++11,-build/c++17

# Non-const reference parameters have been allowed by the Google style guide
# since 2020 and are required by SDK APIs. cpplint 2.0.2 disables this rule by
# default; kept explicit so a future default change does not reintroduce it.
filter=-runtime/references

# Application-private headers are included relative to the including file
# (`#include "foo.hpp"`). Requiring repo-root paths adds noise for independent,
# self-contained applications.
# Include ordering IS enforced: .clang-format IncludeCategories match cpplint's
# build/include_order grouping (related, C system, C++ std, third-party, project).
filter=-build/include_subdir

# Match root-level generated directories without excluding similarly named sources.
exclude_files=^(\.cache|\.venv|\.nv|__pycache__|build(-.*)?|install(-.*)?|data|Testing)$
linelength=100
