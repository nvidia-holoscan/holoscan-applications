name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Application CLI contract and lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PIP_EXTRA_INDEX_URL: https://pypi.nvidia.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repository tools
        run: python -m pip install -r requirements.txt

      - name: Test the shared CI driver
        run: python -m unittest discover -s tests -v

      - name: Verify application lifecycle command construction
        run: |
          holoscan version
          python scripts/holoscan_ci.py

      - name: Lint
        run: holoscan lint
