name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Copyright years are checked against the PR base or previous push.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install repository tools
        run: python -m pip install -r requirements.txt

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-py312-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Lint
        env:
          COPYRIGHT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: holoscan lint

  hosted:
    name: Application checks (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt

      - name: Install test tools
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Test the shared CI driver
        run: python -m unittest discover -s .github/scripts -v

      - name: Verify application lifecycle command construction
        run: |
          holoscan version
          python .github/scripts/holoscan_ci.py

      # Both language scopes are disabled so only SDK-free tests registered in
      # application top-level CMakeLists.txt files are configured and run.
      - name: Run application tests without SDK dependencies
        run: >-
          holoscan test --local --no-xvfb --verbose
          --cmake-options='-DBUILD_ALL=ON;-DHOLOHUB_BUILD_CPP=OFF;-DHOLOHUB_BUILD_PYTHON=OFF'
          --ctest-options=--no-tests=error

      - name: Upload CTest diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: hosted-ctest-python-${{ matrix.python }}
          path: build-*/Testing/**
          retention-days: 7

      - name: Report SDK coverage configuration
        if: matrix.python == '3.12' && (vars.HOLOSCAN_CI_RUNNER_LABELS == '' || vars.HOLOSCAN_CI_SDK_IMAGE == '')
        run: |
          echo 'SDK/GPU tests are disabled: configure HOLOSCAN_CI_RUNNER_LABELS and HOLOSCAN_CI_SDK_IMAGE (see docs/ci.md).' >> "$GITHUB_STEP_SUMMARY"

  docker:
    name: Validate workflows and build tooling image
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm --user "$(id -u):$(id -g)"
          --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo
          rhysd/actionlint:1.7.12 -color
      - name: Build Dockerfile and verify installed CLI
        run: docker build --build-arg BASE_IMAGE=python:3.12-slim --tag holoscan-ci-tools .

  links:
    name: Check documentation links
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: --no-progress --include-fragments './**/*.md'
          fail: true

  sdk:
    name: Build, run, and test applications with the SDK
    # Self-hosted execution is restricted to main, never PR code. The configured
    # image must contain a compatible SDK and dependencies for every application.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
      vars.HOLOSCAN_CI_RUNNER_LABELS != '' && vars.HOLOSCAN_CI_SDK_IMAGE != ''
    needs: [static, hosted, docker]
    runs-on: ${{ fromJSON(vars.HOLOSCAN_CI_RUNNER_LABELS || '["ubuntu-22.04"]') }}
    timeout-minutes: 60
    env:
      SDK_IMAGE: ${{ vars.HOLOSCAN_CI_SDK_IMAGE }}
      CI_IMAGE: holoscan-ci-sdk:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Build SDK tooling image
        shell: bash
        run: |
          docker build --build-arg "BASE_IMAGE=$SDK_IMAGE" --tag "$CI_IMAGE" . 2>&1 | tee sdk-build.log

      - name: Execute application lifecycle
        shell: bash
        run: |
          docker run --rm --gpus all --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env PYTHONUNBUFFERED=1 --env HOME=/workspace "$CI_IMAGE" \
            python3 .github/scripts/holoscan_ci.py --execute 2>&1 | tee sdk-tests.log

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdk-ctest
          path: |
            sdk-*.log
            build-*/Testing/**
          retention-days: 7
